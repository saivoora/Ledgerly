name = "ledgerly"
compatibility_date = "2024-08-01"
pages_build_output_dir = "./public"

[[d1_databases]]
binding = "DB"
database_name = "ledgerly-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ledgerly-bucket"

[triggers]
crons = ["0 8 * * *"]
